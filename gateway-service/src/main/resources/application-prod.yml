server:
  forward-headers-strategy: "${FORWARD_HEADERS_STRATEGY}"

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "${WIFI_ALLOWED_ORIGIN}"
              - "${WIFI_ALLOWED_ORIGIN_ALT}"
  redis:
    host: "${REDIS_HOST}"
    port: "${REDIS_PORT}"
    password: "${REDIS_PASSWORD}"
    database: "${REDIS_DATABASE}"
    ssl: "${REDIS_SSL}"

wifi:
  security:
    gateway-token: "${WIFI_GATEWAY_TOKEN}"
    trust-proxy-headers: "${WIFI_TRUST_PROXY_HEADERS}"
  rate-limit:
    redis-enabled: "${REDIS_RATE_LIMIT_ENABLED}"
