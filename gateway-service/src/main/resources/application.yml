server:
  port: 8080
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - ${WIFI_ALLOWED_ORIGIN:http://portal.test:5173}
              - ${WIFI_ALLOWED_ORIGIN_ALT:http://localhost:5173}
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - Authorization
              - Content-Type
              - Sec-WebSocket-Protocol
              - X-Client-Instance-Id
            exposed-headers:
              - Retry-After
            allow-credentials: true
            max-age: 3600
      routes:
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/users/**,/entitlements/**,/payment/**

        - id: tenant-service-route
          uri: lb://tenant-service
          predicates:
            - Path=/tenants/**

        # 这里只保留普通用户确实需要的自有资源接口。
        - id: device-user-route
          uri: lb://device-service
          predicates:
            - Path=/sessions/**,/traffic/**,/client-signals/**

        - id: admin-service-route
          uri: lb://admin-service
          predicates:
            - Path=/admin/**

        - id: monitor-user-route
          uri: lb://monitor-service
          predicates:
            - Path=/locations/**

        - id: monitor-websocket-route
          uri: lb:ws://monitor-service
          predicates:
            - Path=/ws/alerts
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    ssl: ${REDIS_SSL:false}
    timeout: 500ms
    lettuce:
      shutdown-timeout: 100ms
wifi:
  internal:
    token: ${WIFI_INTERNAL_TOKEN:local-internal-token-change-me}
  jwt:
    # 默认关闭旧 JWT；灰度部署时只允许设置一个明确的 ISO-8601 UTC 截止时间。
    legacy-accept-until: ${WIFI_JWT_LEGACY_ACCEPT_UNTIL:1970-01-01T00:00:00Z}
  context-validation:
    timeout-millis: ${WIFI_CONTEXT_VALIDATION_TIMEOUT_MILLIS:2000}
    read-cache-millis: ${WIFI_CONTEXT_READ_CACHE_MILLIS:5000}
    maximum-cache-entries: ${WIFI_CONTEXT_CACHE_MAX_ENTRIES:4096}
  security:
    # 只证明请求经过 Gateway，不能与内部服务 Token 使用同一个值。
    gateway-token: ${WIFI_GATEWAY_TOKEN:local-gateway-token-change-me}
    trust-proxy-headers: ${WIFI_TRUST_PROXY_HEADERS:false}
  rate-limit:
    auth-per-minute: 30
    portal-per-minute: 12
    location-per-minute: 60
    websocket-per-minute: 10
    payment-callback-per-minute: 120
    oauth-per-minute: 20
    commerce-write-per-minute: 30
    redis-fallback-cooldown-millis: 30000
    fallback-max-keys: 4096
    redis-enabled: ${REDIS_RATE_LIMIT_ENABLED:false}
