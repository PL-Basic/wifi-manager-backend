server:
  port: 8382

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/wifi?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 16MB

wifi:
  upload:
    avatar-dir: ${WIFI_AVATAR_DIR:uploads/avatars}
  internal:
    token: ${WIFI_INTERNAL_TOKEN:local-internal-token-change-me}
  security:
    enabled: true
    gateway-token: ${WIFI_GATEWAY_TOKEN:local-gateway-token-change-me}
    internal-token: ${WIFI_INTERNAL_TOKEN:local-internal-token-change-me}
    internal-path-prefixes:
      - /internal/
  entitlement:
    order-expire-minutes: 15
    close-delay-ms: 60000
    products:
      - code: DURATION_1H
        name: 1小时网络时长
        mode: DURATION
        grant-seconds: 3600
        amount-cents: 100
        enabled: true
      - code: SUBSCRIPTION_30D
        name: 30天网络订阅
        mode: SUBSCRIPTION
        grant-seconds: 2592000
        amount-cents: 1000
        enabled: true
  payment:
    default-channel: ${WIFI_PAYMENT_DEFAULT_CHANNEL:LOCAL_DEMO}
    callback-window-seconds: ${WIFI_PAYMENT_CALLBACK_WINDOW_SECONDS:300}
    local-demo-secret: ${WIFI_PAYMENT_LOCAL_DEMO_SECRET:local-demo-payment-secret-change-me}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:com/plagod/mapper/**/*.xml