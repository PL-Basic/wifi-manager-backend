server:
  port: 8382

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/wifi?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 16MB

wifi:
  upload:
    avatar-dir: ${WIFI_AVATAR_DIR:uploads/avatars}
  internal:
    token: ${WIFI_INTERNAL_TOKEN:local-internal-token-change-me}
  security:
    enabled: true
    gateway-token: ${WIFI_GATEWAY_TOKEN:local-gateway-token-change-me}
    internal-token: ${WIFI_INTERNAL_TOKEN:local-internal-token-change-me}
    internal-path-prefixes:
      - /internal/
  entitlement:
    order-expire-minutes: 15
    close-delay-ms: 60000
    pricing-version: 2
    # 自定义时长基础换算：1 元 = 5 小时，即每 1 分 = 180 秒。
    custom-duration-enabled: true
    custom-duration-min-amount-cents: 100
    custom-duration-max-amount-cents: 100000
    custom-duration-seconds-per-cent: 180
    products:
      - code: DURATION_5H
        name: 5小时网络时长
        mode: DURATION
        grant-seconds: 18000
        amount-cents: 100
        enabled: true
      - code: DURATION_24H
        name: 24小时网络时长
        mode: DURATION
        grant-seconds: 86400
        amount-cents: 390
        enabled: true
      - code: DURATION_100H
        name: 100小时网络时长
        mode: DURATION
        grant-seconds: 360000
        amount-cents: 1290
        enabled: true
      - code: DURATION_300H
        name: 300小时网络时长
        mode: DURATION
        grant-seconds: 1080000
        amount-cents: 1990
        enabled: true
      - code: SUBSCRIPTION_1M
        name: 1个月网络订阅
        mode: SUBSCRIPTION
        grant-months: 1
        amount-cents: 2990
        enabled: true
      - code: SUBSCRIPTION_3M
        name: 3个月网络订阅
        mode: SUBSCRIPTION
        grant-months: 3
        amount-cents: 7490
        enabled: true
      - code: SUBSCRIPTION_6M
        name: 6个月网络订阅
        mode: SUBSCRIPTION
        grant-months: 6
        amount-cents: 13990
        enabled: true
      - code: SUBSCRIPTION_12M
        name: 12个月网络订阅
        mode: SUBSCRIPTION
        grant-months: 12
        amount-cents: 24900
        enabled: true
  payment:
    default-channel: ${WIFI_PAYMENT_DEFAULT_CHANNEL:}
    local-demo-enabled: ${WIFI_PAYMENT_LOCAL_DEMO_ENABLED:false}
    callback-window-seconds: ${WIFI_PAYMENT_CALLBACK_WINDOW_SECONDS:300}
    local-demo-secret: ${WIFI_PAYMENT_LOCAL_DEMO_SECRET:local-demo-payment-secret-change-me}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:com/plagod/mapper/**/*.xml
