server:
  port: 8384
jwt:
  secret: ${JWT_SECRET:local-dev-secret-at-least-32-bytes-long-change-me}
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wifi?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:com/plagod/mapper/**/*.xml

monitor:
  evaluation:
    # 同一 mac 命中同一规则在冷却窗口内不再写告警 / 不再触发自动 action
    cooldown-seconds: 30
wifi:
  internal:
    token: ${WIFI_INTERNAL_TOKEN:local-internal-token-change-me}
  security:
    enabled: true
    gateway-token: ${WIFI_GATEWAY_TOKEN:local-gateway-token-change-me}
    internal-token: ${WIFI_INTERNAL_TOKEN:local-internal-token-change-me}
    internal-path-prefixes:
      - /internal/
  websocket:
    allowed-origin: ${WIFI_ALLOWED_ORIGIN:http://localhost:5173}
    allowed-origin-alt: ${WIFI_ALLOWED_ORIGIN_ALT:http://127.0.0.1:5173}
  location:
    # 同一用户的成功位置上报最小间隔。
    minimum-report-interval-seconds: ${WIFI_LOCATION_MINIMUM_REPORT_INTERVAL_SECONDS:3}
    # 仅拒绝明显异常跳点，默认约等于 360km/h。
    maximum-speed-meters-per-second: ${WIFI_LOCATION_MAXIMUM_SPEED_METERS_PER_SECOND:100}