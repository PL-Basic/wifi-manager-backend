spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wifi?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
server:
  port: 8381
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 至少 256 位的密钥。生产环境放到 Nacos 配置中心覆盖此值。
  secret: ${JWT_SECRET:local-dev-secret-at-least-32-bytes-long-change-me}
  # token 过期时长，毫秒；默认 24 小时。
  expiration-millis: 86400000

verification-code:
  target-interval-seconds: 60
  target-daily-limit: 20
  ip-minute-limit: 10
  ip-daily-limit: 100
  code-length: 6
  expire-minutes: 5
  code-chars: ABCDEFGHJKLMNPQRSTUVWXYZ23456789
  cleanup-retention-days: 7
  cleanup-cron: 0 0 3 * * ?

  phone:
    # 默认本地模式，不会因为缺少阿里云配置阻止服务启动。
    provider: ${PHONE_VERIFICATION_PROVIDER:aliyun-number-auth}
    max-verify-attempts: 5

    aliyun:
      access-key-id: ${ALIYUN_PHONE_AUTH_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_PHONE_AUTH_ACCESS_KEY_SECRET:}
      endpoint: ${ALIYUN_PHONE_AUTH_ENDPOINT:dypnsapi.aliyuncs.com}
      country-code: "86"
      scheme-name: ${ALIYUN_PHONE_AUTH_SCHEME_NAME:}
      sign-name: ${ALIYUN_PHONE_AUTH_SIGN_NAME:恒创联众}
      template-code: ${ALIYUN_PHONE_AUTH_TEMPLATE_CODE:100001}
      template-param: '{"code":"##code##","min":"5"}'
      code-length: 6
      code-type: 1
      duplicate-policy: 1
      interval-seconds: 60
      valid-seconds: 300
      connect-timeout-millis: 5000
      read-timeout-millis: 8000
login:
  fail-protection:
    max-fail-count: 5
    lock-minutes: 10
    fail-window-minutes: 10
    record-keep-days: 30
wifi:
  security:
    enabled: true
    gateway-token: ${WIFI_GATEWAY_TOKEN:local-gateway-token-change-me}
  internal:
    token: ${WIFI_INTERNAL_TOKEN:local-internal-token-change-me}

oauth:
  state-expire-minutes: 10
  connect-timeout-millis: 5000
  read-timeout-millis: 8000
  allowed-return-origins:
    - http://localhost:5173

  github:
    client-id: ${GITHUB_OAUTH_CLIENT_ID:}
    client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:8080/auth/oauth/github/callback}
    scope: "read:user user:email"
    authorization-uri: https://github.com/login/oauth/authorize
    token-uri: https://github.com/login/oauth/access_token
    user-info-uri: https://api.github.com/user
    email-uri: https://api.github.com/user/emails

  qq:
    client-id: ${QQ_OAUTH_CLIENT_ID:}
    client-secret: ${QQ_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${QQ_OAUTH_REDIRECT_URI:http://localhost:8080/auth/oauth/qq/callback}
    scope: get_user_info
    authorization-uri: https://graph.qq.com/oauth2.0/authorize
    token-uri: https://graph.qq.com/oauth2.0/token
    open-id-uri: https://graph.qq.com/oauth2.0/me
    user-info-uri: https://graph.qq.com/user/get_user_info

  wechat:
    client-id: ${WECHAT_OAUTH_CLIENT_ID:}
    client-secret: ${WECHAT_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${WECHAT_OAUTH_REDIRECT_URI:http://localhost:8080/auth/oauth/wechat/callback}
    scope: snsapi_login
    authorization-uri: https://open.weixin.qq.com/connect/qrconnect
    token-uri: https://api.weixin.qq.com/sns/oauth2/access_token
    user-info-uri: https://api.weixin.qq.com/sns/userinfo