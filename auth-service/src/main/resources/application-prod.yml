spring:
  datasource:
    url: "${MYSQL_URL}"
    username: "${MYSQL_USERNAME}"
    password: "${MYSQL_PASSWORD}"
  redis:
    host: "${REDIS_HOST}"
    port: "${REDIS_PORT}"
    password: "${REDIS_PASSWORD}"
    database: "${REDIS_DATABASE}"
    ssl: "${REDIS_SSL}"

mybatis-plus:
  configuration:
    # 生产环境禁止输出 SQL 参数，避免邮箱、手机号和业务数据进入日志。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

wifi:
  internal:
    token: "${WIFI_INTERNAL_TOKEN}"
  security:
    gateway-token: "${WIFI_GATEWAY_TOKEN}"

oauth:
  allowed-return-origins:
    - "${OAUTH_ALLOWED_RETURN_ORIGIN}"
    - "${OAUTH_ALLOWED_RETURN_ORIGIN_ALT}"
