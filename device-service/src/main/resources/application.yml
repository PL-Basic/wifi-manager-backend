server:
  port: 8383

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wifi?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:com/plagod/mapper/**/*.xml

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:device-service}
  username:
  password:
  qos: 1
  status-topic: wifi/device/+/event/status
  traffic-topic: wifi/device/+/event/traffic
  command-result-topic: wifi/device/+/event/command-result
  client-signal-topic: wifi/device/+/event/client-signal
  client-disconnect-topic: wifi/device/+/event/client-disconnect

wifi:
  internal:
    token: ${WIFI_INTERNAL_TOKEN:local-internal-token-change-me}
  portal:
    # 固件约10秒上报一次RSSI，30秒窗口允许偶发丢失两次上报。
    client-signal-max-age-seconds: ${WIFI_PORTAL_CLIENT_SIGNAL_MAX_AGE_SECONDS:30}
    lease-ttl-seconds: ${WIFI_PORTAL_LEASE_TTL_SECONDS:20}
    session-offline-timeout-seconds: ${WIFI_PORTAL_SESSION_OFFLINE_TIMEOUT_SECONDS:30}
    lease-scheduler-enabled: ${WIFI_PORTAL_LEASE_SCHEDULER_ENABLED:true}
    lease-scan-interval-ms: ${WIFI_PORTAL_LEASE_SCAN_INTERVAL_MS:10000}
    lease-initial-delay-ms: ${WIFI_PORTAL_LEASE_INITIAL_DELAY_MS:60000}
  command:
    publish-max-attempts: ${WIFI_COMMAND_PUBLISH_MAX_ATTEMPTS:3}
    publish-retry-delay-seconds: ${WIFI_COMMAND_PUBLISH_RETRY_DELAY_SECONDS:3}
    result-timeout-seconds: ${WIFI_COMMAND_RESULT_TIMEOUT_SECONDS:15}
    scheduler-enabled: ${WIFI_COMMAND_SCHEDULER_ENABLED:true}
    scan-batch-size: ${WIFI_COMMAND_SCAN_BATCH_SIZE:50}
    dispatch-scan-interval-ms: ${WIFI_COMMAND_DISPATCH_SCAN_INTERVAL_MS:1000}
    timeout-scan-interval-ms: ${WIFI_COMMAND_TIMEOUT_SCAN_INTERVAL_MS:1000}
    scheduler-initial-delay-ms: ${WIFI_COMMAND_SCHEDULER_INITIAL_DELAY_MS:5000}