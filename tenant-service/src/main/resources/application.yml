server:
  port: 8386

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/wifi?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}

wifi:
  internal:
    token: ${WIFI_INTERNAL_TOKEN:local-internal-token-change-me}
  security:
    enabled: true
    gateway-token: ${WIFI_GATEWAY_TOKEN:local-gateway-token-change-me}
    internal-token: ${WIFI_INTERNAL_TOKEN:local-internal-token-change-me}
    internal-token-required: true
    internal-path-prefixes:
      - /internal/

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
